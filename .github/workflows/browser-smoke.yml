name: Learning hub real Chromium smoke
on:
  push:
    paths:
      - 'hub/**'
      - 'tests/**'
      - 'scripts/integration-smoke-server.py'
      - '.github/workflows/browser-smoke.yml'
  pull_request:
    paths:
      - 'hub/**'
      - 'tests/**'
      - 'scripts/integration-smoke-server.py'
      - '.github/workflows/browser-smoke.yml'
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/integration-browser.cjs
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-chromium-synthetic-screenshots
          path: tests/browser-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
