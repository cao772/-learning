name: Learning hub checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node scripts/build-course.cjs && node scripts/build-new-knowledge.cjs
      - run: git diff --exit-code -- llm-learning.html new-knowledge.html
      - run: node --check hub/static/hub.js && node --check hub/static/course-sync.js
      - run: docker build -t xunxu-hub:ci .
