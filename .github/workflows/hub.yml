name: Learning hub checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node scripts/build-course.cjs && node scripts/build-new-knowledge.cjs
      - run: git diff --exit-code -- llm-learning.html new-knowledge.html
      - run: node --check hub/static/hub.js && node --check hub/static/course-sync.js && node --check hub/static/discovery-ui.js && node --check hub/static/research-ui.js && node --check hub/static/public-filter.js
      - run: node --test tests/course-sync.cjs
      - run: node --test tests/discovery-ui.cjs
      - run: node --test tests/research-ui.cjs
      - run: node --test tests/public-filter.cjs
      - run: bash -n deploy/host-security-audit.sh deploy/start-preflight.sh deploy/start-production.sh deploy/download-encrypted-backup.sh
      - run: docker build -t xunxu-hub:ci .
